services:
  devsecops-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devsecops-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
